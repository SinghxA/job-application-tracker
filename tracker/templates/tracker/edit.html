<!DOCTYPE html>
<html>
<head>
    <title>Edit Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
        width: 450px;
        max-width: calc(100% - 30px);
        margin: 100px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
}
        h2 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        @media (max-width: 500px) {
        .container {
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            font-size: 22px;
        }
    }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Application</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

</div>

</body>
</html>
