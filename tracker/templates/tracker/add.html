<html>
<head>
    <title>Add Application</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5
        }

        .form-box {
            width: 420px;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        h2 {
            margin: 0 0 25px 0;
            font-size: 22px;
            color: #333;
        }

        form p {
            margin: 0 0 16px 0;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            color: #333;
            font-family: Arial, sans-serif;
        }

        input:focus, select:focus {
            border-color: #3f6df6;
        }

        .helptext {
            display: none;
        }

        button {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 4px;
            background: #3f6df6;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        button:hover {
            background: #315de0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #3f6df6;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Add Job Application</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Application</button>
        </form>

        <a href="{% url 'application_list' %}" class="back-link">← Back to My Applications</a>
    </div>

</body>
</html>
