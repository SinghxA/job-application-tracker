
<html>
<head>
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0f1f4, #ffffff);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 25px 35px;
            border-radius: 2px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
        }

        h2 {
            margin: 0 0 25px 0;
            font-size: 22px;
            color: #333;
        }

        h2::after {
            content: "";
            display: block;
            width: 25px;
            height: 2px;
            background: #3f6df6;
            margin-top: 5px;
        }

        form p {
            margin: 0 0 15px 0;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3f6df6;
        }

        button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 5px;
            background: #416ff5;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #315de0;
        }

        .signup-link {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #666;
        }

        .signup-link a {
            color: #416ff5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">Register now</a>
        </div>

    </div>

</body>
</html>
