<!-- CSRF (Cross-Site Request Forgery) ek security attack hai jisme koi malicious website aapke naam pe fake request bhej sakti hai. {% csrf_token %} Django ka security feature hai — ye ek hidden, unique code generate karta hai har form mein, jisse Django verify karta hai ki request genuinely aapki website se aayi hai, kisi hacker se nahi.

Important: Agar ye line miss kar di, to form submit karte waqt error aayega ("CSRF verification failed") — isliye Django ke har POST form mein ye line hamesha zaroori hai. -->


<!-- Explanation: Yaad kariye — views.py se humne {'form': form} bheja tha. Yahan {{ form.as_p }} us poore form ko automatically render kar deta hai — username field, password field, sab kuch <p> tags mein wrap karke (isliye naam as_p hai — "as paragraphs"). Humein khud se har field ka HTML likhne ki zaroorat nahi padi! -->


<html>
<head>
    <title>Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
           background: #f5f5f5
        }

        .signup-box {
            width: 380px;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 2px;
            box-shadow: 0 8px 25px rgba(205, 200, 200, 0.18);
        }

        h2 {
            margin: 0 0 25px 0;
            font-size: 22px;
            color: #333;
            position: relative;
        }

        h2::after {
            content: "";
            display: block;
            width: 25px;
            height: 2px;
            background: #7f8083;
            margin-top: 5px;
        }

        form p {
            margin: 0 0 14px 0;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
            color: #333;
        }

        input:focus {
            border-color: #cfd9f8;
        }

        .helptext {
            display: none;
        }

        form ul:not(.errorlist) {
            display: none;
        }

        .errorlist {
            color: #e53935;
            font-size: 12px;
            font-weight: bold;
            margin: 5px 0;
            padding-left: 15px;
            list-style: none;
        }

        button {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 5px;
            background: black;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #282b37;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #666;
        }

        .login-link a {
            color: #416ff5;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
        
         .django-message {
    background: #fdecea;
    color: #e53935;
    border: 1px solid #f5c6cb;
    border-radius: 5px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
}

    </style>
</head>

<body>

    <div class="signup-box">

        <h2>Registration</h2>

    {% if messages %}
            {% for message in messages %}
                <p class="django-message">{{ message }}</p>
            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Register Now
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login now</a>
        </div>

    </div>

</body>
</html>
